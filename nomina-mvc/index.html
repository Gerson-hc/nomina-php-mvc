<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Nómina - MVC & POO</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Cálculo de Nómina</h1>
        <p class="subtitle">Patrón MVC + Programación Orientada a Objetos en PHP</p>

        <form action="controllers/ControladorNomina.php" method="POST" class="form-card">
            <div class="form-group">
                <label for="nombre">Nombre del Empleado:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Pérez" required>
            </div>

            <div class="form-group">
                <label for="tipo_empleado">Tipo de Empleado:</label>
                <select id="tipo_empleado" name="tipo_empleado" onchange="cambiarCampos()" required>
                    <option value="">-- Seleccione una opción --</option>
                    <option value="contratista">Contratista</option>
                    <option value="planta">Empleado de Planta</option>
                </select>
            </div>

            <!-- Campos para Contratista -->
            <div id="campos-contratista" class="seccion-dinamica" style="display: none;">
                <h3>Datos de Contratista</h3>
                <div class="form-group">
                    <label for="valor_hora">Valor por Hora ($):</label>
                    <input type="number" id="valor_hora" name="valor_hora" step="0.01" min="1" placeholder="Ej. 25000">
                </div>
                <div class="form-group">
                    <label for="total_horas">Total Horas Trabajadas:</label>
                    <input type="number" id="total_horas" name="total_horas" step="0.5" min="1" placeholder="Ej. 160">
                </div>
            </div>

            <!-- Campos para Planta -->
            <div id="campos-planta" class="seccion-dinamica" style="display: none;">
                <h3>Datos de Empleado de Planta</h3>
                <div class="form-group">
                    <label for="sueldo_basico">Sueldo Básico Mensual ($):</label>
                    <input type="number" id="sueldo_basico" name="sueldo_basico" step="0.01" min="1" placeholder="Ej. 2000000">
                </div>
                <div class="form-group">
                    <label for="horas_extras">Valor Horas Extras ($):</label>
                    <input type="number" id="horas_extras" name="horas_extras" step="0.01" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="deducciones">Total Deducciones ($):</label>
                    <input type="number" id="deducciones" name="deducciones" step="0.01" min="0" value="0">
                </div>
            </div>

            <button type="submit" class="btn-primary">Calcular Salario</button>
        </form>
    </div>

    <script>
        function cambiarCampos() {
            const tipo = document.getElementById('tipo_empleado').value;
            const divContratista = document.getElementById('campos-contratista');
            const divPlanta = document.getElementById('campos-planta');

            // Ocultar ambos por defecto y quitar 'required'
            divContratista.style.display = 'none';
            divPlanta.style.display = 'none';
            document.getElementById('valor_hora').required = false;
            document.getElementById('total_horas').required = false;
            document.getElementById('sueldo_basico').required = false;

            if (tipo === 'contratista') {
                divContratista.style.display = 'block';
                document.getElementById('valor_hora').required = true;
                document.getElementById('total_horas').required = true;
            } else if (tipo === 'planta') {
                divPlanta.style.display = 'block';
                document.getElementById('sueldo_basico').required = true;
            }
        }
    </script>
</body>
</html>
